# Qualité : chaque pull request et chaque push sur main passent ces contrôles.
# Les actions sont épinglées par SHA de commit ; Dependabot les tient à jour.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests, budget et Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint (ESLint, jsx-a11y)
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Tests unitaires (contrastes, tokens, composants)
        run: npm test

      - name: Construction
        run: npm run build

      - name: Budget JavaScript de l'accueil
        run: npm run budget

      - name: Navigateur des tests de bout en bout
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (axe-core, 360 et 1 440 px, clair et sombre)
        run: npm run e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore
